<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runnerapps — Studio IA, Connecteurs & Paiements USD</title>
<script src="https://cloudflare.com"></script>
<script src="https://cloudflare.com"></script>
<style>
:root {
--bg-deep: #040711;
--bg-panel: #0a1024;
--bg-card: #0f172a;
--border-neon: rgba(0, 140, 255, 0.35);
--blue-electric: #0077ff;
--cyan-glow: #00e5ff;
--text-main: #f1f5f9;
--text-muted: #94a3b8;
--success: #10b981;
--warning: #f59e0b;
--danger: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
body { background: var(--bg-deep); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

.mobile-header {
display: none; position: fixed; top: 0; left: 0; right: 0; height: 62px;
background: rgba(4, 7, 17, 0.95); backdrop-filter: blur(10px);
border-bottom: 1px solid var(--border-neon); z-index: 900;
align-items: center; justify-content: space-between; padding: 0 16px;
}
.brand-mini { display: flex; align-items: center; gap: 10px; }
.brand-mini span {
font-weight: 800; font-size: 18px; letter-spacing: 1px;
background: linear-gradient(90deg, #ffffff, #38bdf8);
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.burger-btn {
background: #0f172a; border: 1px solid var(--border-neon); color: var(--cyan-glow);
padding: 7px 13px; border-radius: 8px; font-size: 18px; cursor: pointer;
}

.sidebar {
width: 275px; background: linear-gradient(180deg, #060b19 0%, #03050c 100%);
border-right: 1px solid var(--border-neon);
display: flex; flex-direction: column; padding: 18px 0;
position: fixed; top: 0; bottom: 0; left: 0; overflow-y: auto; z-index: 950;
transition: transform 0.25s ease;
}
.logo-wrapper { text-align: center; padding: 4px 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.logo-title {
margin-top: 8px; font-size: 20px; font-weight: 900; letter-spacing: 1.5px; font-style: italic;
background: linear-gradient(180deg, #ffffff 30%, #94a3b8 65%, #38bdf8 100%);
-webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.logo-sub { font-size: 11px; color: var(--cyan-glow); letter-spacing: 0.5px; margin-top: 2px; }

.nav-section { font-size: 10px; text-transform: uppercase; color: #64748b; padding: 14px 20px 5px; letter-spacing: 1px; font-weight: 700; }
.nav-btn {
padding: 11px 20px; background: none; border: none; color: #cbd5e1;
text-align: left; cursor: pointer; font-size: 13.5px; border-left: 3px solid transparent;
transition: 0.2s; display: flex; align-items: center; gap: 10px; width: 100%;
}
.nav-btn:hover, .nav-btn.active {
background: linear-gradient(90deg, rgba(0, 119, 255, 0.18), transparent);
border-left-color: var(--cyan-glow); color: #ffffff; font-weight: 600;
}

.main-content { flex: 1; margin-left: 275px; padding: 26px; width: calc(100% - 275px); }

.admin-topbar {
background: linear-gradient(90deg, #1e1b4b, #31102f);
border: 1px solid #f43f5e; border-radius: 12px; padding: 12px 18px;
margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
box-shadow: 0 0 20px rgba(244, 63, 94, 0.2);
}
.bell-badge {
background: #ef4444; color: white; font-weight: 800; padding: 3px 10px;
border-radius: 20px; font-size: 12px; margin-left: 6px;
}

.ad-banner {
background: linear-gradient(135deg, #091534 0%, #0f295c 100%);
border: 1px solid var(--border-neon);
padding: 14px 18px; border-radius: 12px; margin-bottom: 22px;
display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
box-shadow: 0 4px 20px rgba(0, 119, 255, 0.12);
}
.ad-badge { background: var(--cyan-glow); color: #040711; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }

.module {
display: none; background: var(--bg-panel); border: 1px solid var(--border-neon);
padding: 26px; border-radius: 14px; max-width: 960px; margin: 0 auto;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
.module.active { display: block; }
h1 {
font-size: 22px; color: #ffffff; margin-bottom: 8px;
border-bottom: 1px solid rgba(0, 229, 255, 0.2); padding-bottom: 12px;
}
.desc { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.55; }

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
.input-group { margin-bottom: 15px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
input, select, textarea {
width: 100%; padding: 11px 13px; border: 1px solid #1e293b; border-radius: 9px;
font-size: 14px; background: #060b19; color: #ffffff; transition: 0.2s;
}
input:focus, select:focus, textarea:focus {
outline: none; border-color: var(--cyan-glow); box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
}

.btn {
background: linear-gradient(135deg, #0066ff 0%, #00aaff 100%);
color: white; border: none; padding: 12px 18px;
border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 14px;
width: 100%; transition: 0.2s; margin-top: 8px;
box-shadow: 0 4px 14px rgba(0, 119, 255, 0.35);
}
.btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
.btn-secondary { background: #1e293b; box-shadow: none; border: 1px solid #334155; }
.btn-success { background: linear-gradient(135deg, #059669, #10b981); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
.btn-warning { background: linear-gradient(135deg, #d97706, #f59e0b); box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
.btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); box-shadow: none; }

.card-box {
border: 1px solid rgba(56, 189, 248, 0.22); border-radius: 11px; padding: 18px;
background: linear-gradient(180deg, #0f172a 0%, #090e1d 100%);
}
.result-box {
margin-top: 18px; padding: 16px; background: #060b19; border-left: 4px solid var(--cyan-glow);
border-radius: 8px; display: none; font-size: 14px; line-height: 1.6; color: #e2e8f0;
}
.status-pill {
display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 700;
background: rgba(0, 229, 255, 0.14); color: var(--cyan-glow); border: 1px solid rgba(0, 229, 255, 0.35);
margin-bottom: 12px;
}

.gate {
position: fixed; inset: 0; background: rgba(2, 4, 10, 0.88); backdrop-filter: blur(8px);
display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px;
}
.gate.hidden { display: none; }
.gate-box {
background: var(--bg-panel); border: 1px solid var(--border-neon); padding: 28px;
border-radius: 16px; width: min(460px, 100%); max-height: 92vh; overflow-y: auto;
box-shadow: 0 0 40px rgba(0, 119, 255, 0.25);
}
.msg { margin-top: 10px; font-size: 13px; font-weight: 600; min-height: 18px; }

.conn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 18px; }
.conn-chip {
background: #060b19; border: 1px solid #1e293b; border-radius: 8px; padding: 10px;
cursor: pointer; transition: 0.2s; text-align: left; color: #e2e8f0;
}
.conn-chip:hover, .conn-chip.selected { border-color: var(--cyan-glow); background: rgba(0, 229, 255, 0.08); }
.conn-chip small { display: block; color: var(--cyan-glow); font-size: 10px; margin-top: 2px; }

@media (max-width: 840px) {
.mobile-header { display: flex; }
.sidebar { transform: translateX(-100%); top: 62px; width: 260px; }
.sidebar.open { transform: translateX(0); }
.main-content { margin-left: 0; width: 100%; padding: 80px 14px 28px; }
.module { padding: 18px; }
}
</style>
</head>
